[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/memory",
    "crates/ai",
    "crates/config",
    "crates/profiles",
    "crates/security",
    "crates/automation",
    "crates/eval",
    "crates/provider",
    "crates/auth",
    "crates/plugins",
    "crates/commands",
    "crates/hooks",
    "crates/script-plugin",
    "crates/workflow",
    "crates/telemetry",
    "crates/update",
    "crates/i18n",
    "crates/tools",
    "crates/agent",
    "crates/session",
    "crates/mcp",
    "crates/plugin",
    "crates/device",
    "crates/lsp",
    "crates/jobs",
    "crates/ast",
    "crates/pty",
    "crates/ui-core",
    "crates/engine",
    "crates/native",
    "crates/cli",
    "examples/plugin-demo",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.lints.clippy]
# 触发它的都是回调形状的签名：ToolGate 的 policy/audit 句柄、测试里的 sink
# 闭包。提 type alias 只把复杂度挪个位置，等拆 agent_loop 时一并做。
type_complexity = "allow"
# 各前端的入口函数一次性接住整套上下文：tui::spawn、tui::run、run_repl、
# repl_command、acp::worker、engine::build_agent。拆成上下文结构体是一次
# 重构任务，不是 lint 修复；需要时在那一处单独 allow。
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The webview and its windowing stack are large; compiling them with the same
# LTO settings as the core makes a window build take minutes for no runtime
# gain.
[profile.dev.package."*"]
opt-level = 2
