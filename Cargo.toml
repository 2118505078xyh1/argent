[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/memory",
    "crates/ai",
    "crates/config",
    "crates/profiles",
    "crates/security",
    "crates/automation",
    "crates/eval",
    "crates/provider",
    "crates/auth",
    "crates/plugins",
    "crates/commands",
    "crates/hooks",
    "crates/workflow",
    "crates/telemetry",
    "crates/update",
    "crates/i18n",
    "crates/tools",
    "crates/agent",
    "crates/session",
    "crates/mcp",
    "crates/plugin",
    "crates/device",
    "crates/lsp",
    "crates/jobs",
    "crates/ast",
    "crates/pty",
    "crates/ui-core",
    "crates/engine",
    "crates/native",
    "crates/cli",
    "examples/plugin-demo",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.lints.clippy]
# 回调句柄（policy/approve/audit…）在十个字段上重复同一签名；提 type alias
# 的收益是可读性，不是正确性，等拆 agent_loop 时一并做。
type_complexity = "allow"
# run/tui::spawn/repl_command 这类入口函数确实要一次性接住整套上下文。
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The webview and its windowing stack are large; compiling them with the same
# LTO settings as the core makes a window build take minutes for no runtime
# gain.
[profile.dev.package."*"]
opt-level = 2
