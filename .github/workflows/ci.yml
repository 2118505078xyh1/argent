name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # The development platform: the TUI, the Windows Job Object sandbox and the
  # ConPTY probes are Windows-specific, so the suite runs there.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace

  # No Docker on the development machine: this job is the only place the
  # container image is built from scratch.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f docker/Dockerfile -t argent:ci .
