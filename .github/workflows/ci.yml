name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # The Windows job below owns the TUI/ConPTY and Job Object paths. This job
  # exercises the portable crates on Linux, where path handling, curl TLS,
  # auth backends and shell fallbacks behave differently.
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: test portable crates
        run: >-
          cargo test --locked
          -p argent-core
          -p argent-config
          -p argent-security
          -p argent-session
          -p argent-ai
          -p argent-provider
          -p argent-tools
          -p argent-agent
          -p argent-plugins
          -p argent-mcp
          -p argent-commands
          -p argent-hooks
          -p argent-eval

  # The development platform: the TUI, the Windows Job Object sandbox and the
  # ConPTY probes are Windows-specific, so the suite runs there.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked
      - name: release size and startup smoke
        shell: pwsh
        run: |
          cargo build --release --locked -p argent-cli
          $exe = "target/release/argent.exe"
          $size = (Get-Item $exe).Length
          if ($size -gt 8MB) {
            throw "argent.exe grew to $size bytes (budget 8MB)"
          }
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          & $exe --version | Out-Null
          $watch.Stop()
          if ($watch.ElapsedMilliseconds -gt 3000) {
            throw "argent.exe --version took $($watch.ElapsedMilliseconds) ms (budget 3000 ms)"
          }
          Write-Host "release smoke: $size bytes, $($watch.ElapsedMilliseconds) ms"

  # Race-hunting: one thread at a time surfaces order-dependent tests and
  # shared-temp-dir collisions that parallel runs hide. The portable crates
  # are the same set the Linux job runs.
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test portable crates single-threaded
        run: >-
          cargo test --locked
          -p argent-core
          -p argent-config
          -p argent-security
          -p argent-session
          -p argent-ai
          -p argent-provider
          -p argent-tools
          -p argent-agent
          -p argent-plugins
          -p argent-mcp
          -p argent-commands
          -p argent-hooks
          -p argent-eval
          -- --test-threads=1

  # macOS exercises the third path family: keyring, Homebrew curl TLS and
  # POSIX path handling, with none of the Windows-only crates.
  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test portable crates
        run: >-
          cargo test --locked
          -p argent-core
          -p argent-config
          -p argent-security
          -p argent-session
          -p argent-ai
          -p argent-provider
          -p argent-tools
          -p argent-agent
          -p argent-plugins
          -p argent-mcp
          -p argent-commands
          -p argent-hooks
          -p argent-eval

  # iced 0.14 needs Rust 1.88, so the CLI/core MSRV excludes the GUI crate.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace --exclude argent-native --all-features --locked

  # No Docker on the development machine: this job is the only place the
  # container image is built from scratch.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f docker/Dockerfile -t argent:ci .
