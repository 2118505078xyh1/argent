name: tauri-prototype

# Deliberately separate from ci.yml: the main workspace must never need
# WebKit/Tauri system dependencies. Only runs when prototype files change.
on:
  push:
    branches: [master]
    paths:
      - "crates/tauri-app/**"
      - "scripts/tauri-smoke.py"
      - "tests/fixtures/tauri_smoke_provider.py"
      - ".github/workflows/tauri.yml"
  pull_request:
    paths:
      - "crates/tauri-app/**"
      - "scripts/tauri-smoke.py"
      - "tests/fixtures/tauri_smoke_provider.py"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Version consistency
        run: python scripts/check-tauri-version.py

      - name: Rust check, test and clippy
        working-directory: crates/tauri-app
        run: |
          cargo check
          cargo test --bin argent-tauri
          cargo clippy --all-targets -- -D warnings

      - name: Frontend typecheck, unit tests and build
        working-directory: crates/tauri-app/ui
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

      - name: Build prototype binary
        working-directory: crates/tauri-app
        run: cargo build

      - name: CDP end-to-end smoke
        # WebView2 availability varies on hosted runners; keep the gate green
        # while still surfacing failures in the job log.
        continue-on-error: true
        run: |
          python -m pip install websockets
          python scripts/tauri-smoke.py
