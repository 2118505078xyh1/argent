[package]
name = "argent-native"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "argent native desktop frontend (iced, no WebView)"

[lints]
workspace = true

[features]
default = []
script-plugins = ["argent-engine/script-plugins"]

[[bin]]
name = "argent-native"
path = "src/main.rs"

[dependencies]
# tiny-skia renders on the CPU: the same window costs ~19 MB instead of the
# ~260 MB a wgpu swapchain and driver reserve. A chat transcript does not need
# a GPU. `tokio` gives the event loop timers (`time::every`).
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "tokio",
    "crisp",
    "web-colors",
    "advanced",
] }
argent-core = { path = "../core" }
argent-config = { path = "../config" }
argent-agent = { path = "../agent" }
argent-session = { path = "../session" }
argent-engine = { path = "../engine" }
argent-ui-core = { path = "../ui-core" }
argent-profiles = { path = "../profiles" }
argent-automation = { path = "../automation" }
argent-tools = { path = "../tools" }
argent-i18n = { path = "../i18n" }
