[workspace]

[package]
name = "argent-tauri"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Argent desktop shell (Tauri 2 + SolidJS migration prototype)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argent-agent = { path = "../agent" }
argent-automation = { path = "../automation" }
argent-core = { path = "../core" }
argent-engine = { path = "../engine" }
argent-tools = { path = "../tools" }
argent-ui-core = { path = "../ui-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
