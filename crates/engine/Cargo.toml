[package]
name = "argent-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The agent worker behind every UI: sessions, commands, events and approvals"

[lints]
workspace = true

[features]
default = []
script-plugins = ["argent-plugins/script-plugins"]

[dependencies]
argent-core = { path = "../core" }
argent-ai = { path = "../ai" }
argent-config = { path = "../config" }
argent-auth = { path = "../auth" }
argent-provider = { path = "../provider" }
argent-profiles = { path = "../profiles" }
argent-security = { path = "../security" }
argent-tools = { path = "../tools" }
argent-agent = { path = "../agent" }
argent-ui-core = { path = "../ui-core" }
argent-session = { path = "../session" }
argent-mcp = { path = "../mcp" }
argent-plugins = { path = "../plugins" }
argent-plugin = { path = "../plugin" }
argent-hooks = { path = "../hooks" }
argent-lsp = { path = "../lsp" }
argent-jobs = { path = "../jobs" }
argent-automation = { path = "../automation" }

[dev-dependencies]
argent-ui-core = { path = "../ui-core", features = ["test-support"] }
